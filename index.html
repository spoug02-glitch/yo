<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>버터떡 유행왕 승계까지, D-7</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

    /* ══ Star Wars Crawl ══ */
    .sw-wrap {
      position: relative;
      width: 100%;
      height: 440px;
      background: #000;
      overflow: hidden;
    }
    /* starfield */
    .sw-wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 8%  12%, #fff 100%, transparent),
        radial-gradient(1px 1px at 22% 38%, #fff 100%, transparent),
        radial-gradient(1px 1px at 38% 7%,  #fff 100%, transparent),
        radial-gradient(1px 1px at 53% 58%, #fff 100%, transparent),
        radial-gradient(1px 1px at 67% 22%, #fff 100%, transparent),
        radial-gradient(1px 1px at 83% 73%, #fff 100%, transparent),
        radial-gradient(1px 1px at 91% 9%,  #fff 100%, transparent),
        radial-gradient(1px 1px at 4%  78%, #fff 100%, transparent),
        radial-gradient(1px 1px at 61% 88%, #fff 100%, transparent),
        radial-gradient(1px 1px at 33% 68%, #fff 100%, transparent),
        radial-gradient(1px 1px at 76% 44%, #fff 100%, transparent),
        radial-gradient(1px 1px at 16% 52%, #fff 100%, transparent),
        radial-gradient(1.5px 1.5px at 47% 29%, rgba(255,255,255,.8) 100%, transparent),
        radial-gradient(2px   2px   at 88% 17%, rgba(255,255,255,.5) 100%, transparent),
        radial-gradient(2px   2px   at 14% 91%, rgba(255,255,255,.4) 100%, transparent);
    }
    /* bottom gradient: black → page dark navy */
    .sw-wrap::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 120px;
      background: linear-gradient(to bottom, transparent 0%, #050510 60%, #09091e 100%);
      pointer-events: none;
      z-index: 10;
    }

    /* logo flash */
    .sw-logo {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(1);
      color: #ffd700;
      font-size: clamp(3rem, 9vw, 5.5rem);
      font-weight: 900;
      text-align: center;
      letter-spacing: .05em;
      line-height: 1.15;
      opacity: 0;
      animation: swLogo 3s ease 3.2s forwards;
      z-index: 5;
      white-space: nowrap;
      text-shadow: 0 0 40px rgba(255,215,0,.6), 0 0 80px rgba(255,215,0,.3);
    }
    @keyframes swLogo {
      0%   { opacity: 0; transform: translate(-50%,-50%) scale(.12); }
      18%  { opacity: 1; transform: translate(-50%,-50%) scale(1);   }
      75%  { opacity: 1; transform: translate(-50%,-50%) scale(1.08);}
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1.18);}
    }

    /* SW ending card — 🍞 EPISODE VII */
    .sw-ending {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      opacity: 0;
      animation: swEnding 3.5s ease 6s forwards;
      z-index: 6;
      pointer-events: none;
    }
    @keyframes swEnding {
      0%   { opacity: 0; letter-spacing: .6em; }
      30%  { opacity: 1; }
      80%  { opacity: 1; letter-spacing: .3em; }
      100% { opacity: 0; }
    }
    .sw-ending .ep-label {
      color: #5ab4d4;
      font-size: clamp(.65rem, 2vw, .85rem);
      letter-spacing: .4em;
      font-weight: 700;
      margin-bottom: .4rem;
    }
    .sw-ending .ep-title {
      color: #ffd700;
      font-size: clamp(.9rem, 3vw, 1.3rem);
      font-weight: 900;
      letter-spacing: .15em;
    }

    /* crawl stage */
    .sw-stage {
      position: absolute;
      inset: 0;
      perspective: 380px;
      overflow: hidden;
    }
    .sw-stage::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 50%;
      background: linear-gradient(to bottom, #000 20%, transparent);
      pointer-events: none;
      z-index: 3;
    }
    .sw-crawl {
      position: absolute;
      bottom: -100%;
      left: 12%; width: 76%;
      text-align: center;
      color: #ffd700;
      font-size: clamp(.85rem, 2.2vw, 1.05rem);
      font-weight: 700;
      line-height: 2;
      transform-origin: 50% 100%;
      transform: rotateX(22deg);
      animation: swCrawl 30s linear 6.5s forwards;
      z-index: 2;
    }
    @keyframes swCrawl {
      0%   { bottom: -120%; }
      100% { bottom: 160%; }
    }
    .sw-crawl .ep    { color:#5ab4d4; letter-spacing:.3em; font-size:.88em; margin-bottom:.4rem; }
    .sw-crawl .title { font-size:1.6em; margin-bottom:1.5rem; letter-spacing:.08em; }
    .sw-crawl p      { margin-bottom:1.2rem; }
    /* 크롤의 .final은 공간만 차지하고 보이지 않음 (고정 레이어가 담당) */
    .sw-crawl p.final { visibility: hidden; }

    /* 크롤을 따라 올라오다가 화면 중앙에 고정 */
    .sw-fixed-msg {
      position: absolute;
      top: 50%; left: 50%;
      text-align: center;
      color: #fff;
      font-size: clamp(1.05rem, 3.8vw, 1.8rem);
      font-weight: 900;
      line-height: 1.65;
      letter-spacing: .04em;
      text-shadow: 0 0 20px rgba(255,215,0,1), 0 0 50px rgba(255,215,0,.6);
      opacity: 0;
      z-index: 7;
      /* delay 21s = 크롤 시작(6.5s) + 약 14.5s 후 마지막 문장이 화면 하단 도달 시점 */
      animation: swFixedMsg 16s cubic-bezier(.22,.68,0,1.05) 21s forwards;
    }
    @keyframes swFixedMsg {
      /* 크롤과 같은 원근 틸트로 하단에서 등장 */
      0%   { opacity: 0; transform: translate(-50%, 320px) perspective(380px) rotateX(18deg) scale(.75); }
      8%   { opacity: 1; transform: translate(-50%, 140px) perspective(380px) rotateX(10deg) scale(.9);  }
      /* 중앙에 도달하며 틸트 풀림 → 고정 */
      22%  { opacity: 1; transform: translate(-50%, -50%)  perspective(380px) rotateX(0deg)  scale(1);   }
      75%  { opacity: 1; transform: translate(-50%, -50%)  perspective(380px) rotateX(0deg)  scale(1);   }
      100% { opacity: 0; transform: translate(-50%, -50%)  perspective(380px) rotateX(0deg)  scale(1);   }
    }

    /* ══ General Animations ══ */
    @keyframes fadeInUp {
      from { opacity:0; transform:translateY(18px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .fade-in-up { animation: fadeInUp .4s ease forwards; }

    @keyframes scaleIn {
      from { opacity:0; transform:scale(.93); }
      to   { opacity:1; transform:scale(1); }
    }
    .scale-in { animation: scaleIn .35s ease forwards; }

    @keyframes ping {
      75%, 100% { transform:scale(2); opacity:0; }
    }
    .ping { animation: ping 1.2s cubic-bezier(0,0,.2,1) infinite; }

    .vote-btn { transition: transform .12s ease, box-shadow .12s ease; cursor: pointer; }
    .vote-btn:hover  { transform: translateY(-2px); }
    .vote-btn:active { transform: scale(.95); }

    .progress-bar { transition: width 1.1s cubic-bezier(.4,0,.2,1); }

    /* ══ Ticker ══ */
    @keyframes tickerIn {
      from { opacity:0; transform:translateX(-8px); }
      to   { opacity:1; transform:translateX(0); }
    }
    .ticker-item { animation: tickerIn .25s ease forwards; }

    /* hide scrollbar inside ticker */
    .ticker-scroll { scrollbar-width: none; }
    .ticker-scroll::-webkit-scrollbar { display: none; }

    /* ══ D-1 Badge pulse ══ */
    @keyframes d1Glow {
      0%,100% { box-shadow: 0 0 12px rgba(255,100,0,.4); }
      50%      { box-shadow: 0 0 28px rgba(255,100,0,.9); }
    }
    .d1-badge { animation: d1Glow 1.6s ease infinite; }

    /* global scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #0a0a1a; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── Constants ── */
const BANNED = ["씨발","병신","좆","fuck","shit","개새","ㅅㅂ","ㅂㅅ","새끼","미친놈","존나","ㅈㄴ"];
const NICK_PRE = ["익명","떡덕후","버터러","떡러버","user_","쌀가루","버터떡러","단팥맨"];

/* 각 댓글은 고정 닉네임과 쌍으로 묶여 있음 — 같은 댓글은 항상 같은 아이디로 표시 */
const D1_POOL = {
  인정: [
    { nick:"떡순이99",    text:"내 주변 지인들 다 이거 사먹던데..?" },
    { nick:"버터떡사수대", text:"ㅋㅋ 솔직히 이 조합 은근 맛있음 ㅇㅇ 우리가 밀면 된다" },
    { nick:"떡덕후77",    text:"ㅋㅋㅋ 애쓴다 애써 이런 사이트나 만들고" },
    { nick:"쌀가루마스터", text:"버터떡이면 진짜 될 것 같은데 우리가 만들자" },
  ],
  억지: [
    { nick:"단팥이싫어",  text:"당연 안 되지 내 주변에 버터떡 먹었단 사람 아무도 없음" },
    { nick:"크림떡파",    text:"버터빵도 논란이었는데 버터떡은 더 심하지 않냐" },
    { nick:"현실주의자",  text:"현실을 살아 인간들아" },
    { nick:"편의점왕",    text:"아 실수;; 이거 왜 투표 되돌리기 없음 개똥망사이트" },
  ],
};

/* 전역 플래그 — StrictMode 이중 실행 완전 차단 */
let _tickerStarted = false;

/* ── MAU 추적 헬퍼 ── */
function recordVisit() {
  const today = new Date().toISOString().slice(0, 10);          // "YYYY-MM-DD"
  const month = today.slice(0, 7);                               // "YYYY-MM"
  const lastDate = localStorage.getItem("butter_last_visit") || "";
  if (lastDate === today) return;                                 // 오늘 이미 기록됨
  localStorage.setItem("butter_last_visit", today);
  const raw = localStorage.getItem("butter_mau");
  const data = raw ? JSON.parse(raw) : {};
  data[month] = (data[month] || 0) + 1;
  localStorage.setItem("butter_mau", JSON.stringify(data));
}

function getMauData() {
  const raw = localStorage.getItem("butter_mau");
  return raw ? JSON.parse(raw) : {};
}

/* ── MAU 패널 컴포넌트 ── */
function MauPanel() {
  const [data, setData] = React.useState({});
  const [open, setOpen] = React.useState(false);

  React.useEffect(() => {
    recordVisit();
    setData(getMauData());
  }, []);

  const months = Object.keys(data).sort();
  const total  = months.reduce((s, m) => s + data[m], 0);
  const currentMonth = new Date().toISOString().slice(0, 7);

  const maxVal = Math.max(...months.map(m => data[m]), 1);

  const MONTH_KO = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
  function fmtMonth(ym) {
    const [y, m] = ym.split("-");
    return `${y}년 ${MONTH_KO[parseInt(m) - 1]}`;
  }

  return (
    <div style={{ background:"#0d0d1f", border:"1px solid #1e1e4a", borderRadius:"18px", padding:"1rem 1.2rem", marginBottom:"2rem" }}>
      {/* 헤더 */}
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", cursor:"pointer" }} onClick={() => setOpen(v => !v)}>
        <div style={{ display:"flex", alignItems:"center", gap:"10px" }}>
          <span style={{ fontSize:"1rem" }}>📊</span>
          <span style={{ fontWeight:800, fontSize:".9rem", color:"#a78bfa" }}>MAU 현황</span>
          <span style={{
            background:"#4c1d95", color:"#c4b5fd", fontSize:".68rem",
            padding:"2px 8px", borderRadius:"999px", fontWeight:700,
          }}>누적 {total.toLocaleString()}회</span>
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:"14px" }}>
          <div style={{ textAlign:"right" }}>
            <div style={{ color:"#6b7280", fontSize:".62rem", marginBottom:"1px" }}>이번 달</div>
            <div style={{ color:"#a78bfa", fontWeight:900, fontSize:"1.1rem", lineHeight:1 }}>
              {(data[currentMonth] || 0).toLocaleString()}
              <span style={{ color:"#6b7280", fontSize:".65rem", fontWeight:400, marginLeft:"2px" }}>DAU</span>
            </div>
          </div>
          <span style={{ color:"#4b5563", fontSize:".8rem" }}>{open ? "▲" : "▼"}</span>
        </div>
      </div>

      {/* 상세 */}
      {open && (
        <div style={{ marginTop:"1rem", borderTop:"1px solid #1e1e4a", paddingTop:"1rem" }}>
          {months.length === 0 ? (
            <div style={{ color:"#4b5563", fontSize:".78rem", textAlign:"center", padding:"12px 0" }}>아직 기록이 없습니다</div>
          ) : (
            <div style={{ display:"flex", flexDirection:"column", gap:"8px" }}>
              {months.map(m => {
                const val  = data[m];
                const pct  = Math.round((val / maxVal) * 100);
                const isCur = m === currentMonth;
                return (
                  <div key={m}>
                    <div style={{ display:"flex", justifyContent:"space-between", fontSize:".72rem", marginBottom:"3px" }}>
                      <span style={{ color: isCur ? "#a78bfa" : "#6b7280", fontWeight: isCur ? 700 : 400 }}>
                        {fmtMonth(m)}{isCur && " ●"}
                      </span>
                      <span style={{ color: isCur ? "#a78bfa" : "#9ca3af", fontWeight:700 }}>{val.toLocaleString()}회</span>
                    </div>
                    <div style={{ height:"6px", background:"#1a1a3a", borderRadius:"999px", overflow:"hidden" }}>
                      <div style={{
                        height:"100%", borderRadius:"999px",
                        width:`${pct}%`,
                        background: isCur
                          ? "linear-gradient(90deg,#7c3aed,#a78bfa)"
                          : "linear-gradient(90deg,#374151,#6b7280)",
                        transition:"width .8s cubic-bezier(.4,0,.2,1)",
                      }}/>
                    </div>
                  </div>
                );
              })}
              <div style={{ textAlign:"right", color:"#4b5563", fontSize:".68rem", marginTop:"4px", borderTop:"1px solid #1e1e4a", paddingTop:"8px" }}>
                총합: <span style={{ color:"#a78bfa", fontWeight:800 }}>{total.toLocaleString()}회</span>
                &nbsp;({months.length}개월)
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function genNick() {
  const p = NICK_PRE[Math.floor(Math.random() * NICK_PRE.length)];
  const n = Math.floor(Math.random() * 9000) + 1000;
  if (p === "익명") return `익명#${n}`;
  if (p === "user_") return `user_${n}`;
  return `${p}${n}`;
}
function hasBad(t) {
  const lo = t.toLowerCase();
  return BANNED.some(w => lo.includes(w.toLowerCase()));
}
function fmtTime() {
  return new Date().toLocaleTimeString("ko-KR", { hour:"2-digit", minute:"2-digit" });
}
function checkD1() {
  if (new URLSearchParams(window.location.search).has("d1")) return true;
  const fv = localStorage.getItem("butter_firstvisit");
  if (!fv) { localStorage.setItem("butter_firstvisit", Date.now().toString()); return false; }
  return (Date.now() - parseInt(fv)) >= 6 * 24 * 60 * 60 * 1000;
}

/* ── D-Day Sequence ── */
function DDaySequence({ agreeP }) {
  const [phase, setPhase] = React.useState(0); // 0=탄생중, 1=탄생완료

  React.useEffect(() => {
    const t = setTimeout(() => setPhase(1), 4000);
    return () => clearTimeout(t);
  }, []);

  return (
    <div style={{
      position:"fixed", inset:0, zIndex:9999,
      background:"#000010",
      display:"flex", alignItems:"center", justifyContent:"center",
      flexDirection:"column",
    }}>
      {phase === 0 ? (
        <div key="phase0" style={{
          color:"#ffd700", fontWeight:900,
          fontSize:"clamp(1.4rem,5vw,2.4rem)",
          textAlign:"center", lineHeight:1.7,
          padding:"0 2rem",
          animation:"fadeInUp .6s ease forwards",
        }}>
          🍡 버터떡이<br/>태어나는 중...
          <div style={{ marginTop:"2rem", fontSize:"clamp(.85rem,2.5vw,1.1rem)", color:"#9ca3af", fontWeight:400 }}>
            유행왕국 14827번째 왕좌 승계 실험
          </div>
          <div style={{ marginTop:"2rem", display:"flex", gap:"8px", justifyContent:"center" }}>
            {[0,1,2].map(i => (
              <div key={i} style={{
                width:"10px", height:"10px", borderRadius:"50%", background:"#ffd700",
                animation:`ping 1.2s cubic-bezier(0,0,.2,1) ${i*0.3}s infinite`,
              }}/>
            ))}
          </div>
        </div>
      ) : (
        <div key="phase1" style={{
          color:"#fff", fontWeight:900,
          fontSize:"clamp(1.2rem,4.5vw,2rem)",
          textAlign:"center", lineHeight:1.8,
          padding:"0 2rem",
          animation:"fadeInUp .6s ease forwards",
        }}>
          {agreeP >= 50 ? (
            <>
              <div style={{ color:"#ffd700", fontSize:"clamp(1.8rem,6vw,3rem)", marginBottom:"1rem" }}>👑</div>
              버터떡의 탄생 완료.<br/>
              <span style={{ color:"#ffd700" }}>유행왕좌를 승계받았습니다.</span>
            </>
          ) : (
            <>
              <div style={{ fontSize:"clamp(1.8rem,6vw,3rem)", marginBottom:"1rem" }}>💔</div>
              버터떡의 탄생 완료.<br/>
              <span style={{ color:"#f87171" }}>유행왕좌 승계에 실패했습니다.</span>
            </>
          )}
        </div>
      )}
    </div>
  );
}

/* ── Star Wars Crawl ── */
function StarWarsCrawl() {
  return (
    <div className="sw-wrap">
      <div className="sw-logo">버터떡 유행왕<br/>승계까지 D-7</div>
      <div className="sw-ending">
        <div className="ep-label">🍡 EPISODE VIII</div>
        <div className="ep-title">유행왕 승계 실험</div>
      </div>
      <div className="sw-fixed-msg">
        당신의 한 표가<br/>버터떡의 운명을 결정한다.
      </div>
      <div className="sw-stage">
        <div className="sw-crawl">
          <div className="ep">에피소드 VIII</div>
          <div className="title">버터떡 유행왕 승계까지 D-7</div>
          <p>버터빵은<br/>왕좌를 잇지 못했다.</p>
          <p>그러자 버터빵의 비운의 후계자,<br/>버터떡이 등장하는데....</p>
          <p>"저는 아버지와 다릅니다.<br/>유행왕좌, 제가 가질 것입니다."</p>
          <p>버터떡의 오만한 선언이<br/>유행왕국의 14827번째<br/>왕좌 승계 전쟁의 시작이었다…….</p>
          <p className="final">당신의 한 표가<br/>버터떡의 운명을 결정한다.</p>
        </div>
      </div>
    </div>
  );
}

/* ── Ticker Item (inline edit/delete) ── */
function TickerItem({ item, onEdit, onDelete, isOwn, showVote }) {
  const [mode, setMode]       = useState(null);
  const [editVal, setEditVal] = useState(item.text);
  const [pw, setPw]           = useState("");
  const [err, setErr]         = useState("");

  function open(m) { setMode(m); setPw(""); setErr(""); }
  function close()  { setMode(null); }
  function submit() {
    if ((pw.trim() || "0000") !== item.password) { setErr("비밀번호 틀림"); return; }
    if (mode === "delete") { onDelete(item.id); return; }
    if (!editVal.trim()) return;
    if (hasBad(editVal)) { setErr("부적절한 표현은 사용할 수 없습니다"); return; }
    onEdit(item.id, editVal.trim());
    close();
  }

  const isD1 = !!item.isD1;

  return (
    <div className="ticker-item" style={{
      marginBottom: "6px",
      padding: "8px 10px",
      borderRadius: "10px",
      background: "rgba(255,255,255,.03)",
      borderLeft: `2px solid ${isD1 ? (item.vote === "인정" ? "#22c55e" : "#ef4444") + "55" : "transparent"}`,
    }}>
      {/* header */}
      <div style={{ display:"flex", alignItems:"center", gap:"5px", marginBottom:"3px", flexWrap:"wrap" }}>
        {(isD1 || showVote) && (
          <span style={{
            fontSize:".62rem", padding:"1px 5px", borderRadius:"4px", fontWeight:800,
            background: item.vote === "인정" ? "#14532d" : "#450a0a",
            color:      item.vote === "인정" ? "#86efac" : "#fca5a5",
          }}>{item.vote === "인정" ? "[밀어본다]" : "[안 된다]"}</span>
        )}
        <span style={{ color:"#ffd700", fontSize:".72rem", fontWeight:700 }}>{item.nickname}</span>
        <span style={{ color:"#444", fontSize:".65rem", marginLeft:"auto" }}>{item.time}</span>
      </div>
      {/* body */}
      {mode === "edit" ? (
        <textarea
          value={editVal}
          onChange={e => setEditVal(e.target.value)}
          rows={2}
          style={{ width:"100%", background:"#0f0f1f", color:"#fff", borderRadius:"7px", padding:"5px 8px", fontSize:".78rem", border:"1px solid #3a3a6a", resize:"none", outline:"none", marginBottom:"5px" }}
        />
      ) : (
        <p style={{ color:"#c9c9c9", fontSize:".78rem", lineHeight:1.5 }}>{item.text}</p>
      )}
      {/* actions (only for own real comments) */}
      {isOwn && !mode && (
        <div style={{ display:"flex", gap:"8px", marginTop:"3px" }}>
          <button onClick={() => open("edit")}   style={{ color:"#555", fontSize:".65rem", background:"none", border:"none", cursor:"pointer" }} onMouseOver={e=>e.target.style.color="#60a5fa"} onMouseOut={e=>e.target.style.color="#555"}>수정</button>
          <button onClick={() => open("delete")} style={{ color:"#555", fontSize:".65rem", background:"none", border:"none", cursor:"pointer" }} onMouseOver={e=>e.target.style.color="#f87171"} onMouseOut={e=>e.target.style.color="#555"}>삭제</button>
        </div>
      )}
      {mode && (
        <div style={{ display:"flex", gap:"5px", alignItems:"center", marginTop:"5px", flexWrap:"wrap" }}>
          <input type="password" placeholder="비밀번호" value={pw}
            onChange={e => { setPw(e.target.value); setErr(""); }}
            onKeyDown={e => e.key === "Enter" && submit()}
            style={{ flex:1, minWidth:"60px", background:"#0f0f1f", color:"#fff", borderRadius:"7px", padding:"4px 8px", fontSize:".75rem", border:"1px solid #3a3a6a", outline:"none" }}
          />
          <button onClick={submit} style={{ background: mode==="delete"?"#dc2626":"#2563eb", color:"#fff", border:"none", borderRadius:"7px", padding:"4px 10px", fontSize:".72rem", cursor:"pointer", fontWeight:700 }}>
            {mode === "edit" ? "저장" : "삭제"}
          </button>
          <button onClick={close} style={{ background:"#374151", color:"#9ca3af", border:"none", borderRadius:"7px", padding:"4px 8px", fontSize:".72rem", cursor:"pointer" }}>취소</button>
          {err && <span style={{ color:"#f87171", fontSize:".68rem", width:"100%" }}>{err}</span>}
        </div>
      )}
    </div>
  );
}

/* ── Ticker Column ── */
const THEME = {
  인정: { label:"👍 밀어본다", color:"#4ade80", bg:"#061209", border:"#166534" },
  억지: { label:"👎 안 된다",  color:"#f87171", bg:"#120606", border:"#7f1d1d" },
  all:  { label:"🔴 LIVE — 전체 실시간", color:"#fb923c", bg:"#0d0905", border:"#9a3412" },
};

function TickerColumn({ side, items, onEdit, onDelete, userNick, fullWidth }) {
  const scrollRef = useRef(null);
  const t = THEME[side];

  useEffect(() => {
    const el = scrollRef.current;
    if (!el) return;
    const nearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 120;
    if (nearBottom) el.scrollTo({ top: el.scrollHeight, behavior: "smooth" });
  }, [items.length]);

  return (
    <div style={{ flex:1, minWidth:0 }}>
      {/* Column header */}
      <div style={{ display:"flex", alignItems:"center", gap:"6px", marginBottom:"8px" }}>
        <span style={{ color:t.color, fontWeight:800, fontSize:".9rem" }}>{t.label}</span>
        <span style={{ color:"#555", fontSize:".72rem" }}>({items.length})</span>
      </div>

      {/* Ticker box */}
      <div style={{ position:"relative", height:"300px", borderRadius:"16px", overflow:"hidden", border:`1px solid ${t.border}`, background:t.bg }}>
        {/* top fade */}
        <div style={{
          position:"absolute", top:0, left:0, right:0, height:"70px",
          background:`linear-gradient(to bottom, ${t.bg} 20%, transparent)`,
          pointerEvents:"none", zIndex:2,
        }}/>
        {/* scroll area */}
        <div ref={scrollRef} className="ticker-scroll" style={{ height:"100%", overflowY:"auto", padding:"70px 8px 10px" }}>
          {items.length === 0 ? (
            <div style={{ textAlign:"center", color:"#4b5563", paddingTop:"60px", fontSize:".78rem" }}>
              {side === "인정" ? "밀어본다는 첫 댓글 👍" : "안 된다고 말해봐 👎"}
            </div>
          ) : (
            items.map(item => (
              <TickerItem
                key={item.id}
                item={item}
                onEdit={onEdit}
                onDelete={onDelete}
                isOwn={!item.isD1 && item.nickname === userNick}
                showVote={side === "all"}
              />
            ))
          )}
        </div>
      </div>
    </div>
  );
}

/* ── Main App ── */
function App() {
  const [voted,       setVoted]       = useState(false);
  const [voteType,    setVoteType]    = useState(null);
  const [agreeP,      setAgreeP]      = useState(62);
  const [voteCount,   setVoteCount]   = useState(0);
  const [comments,    setComments]    = useState([]);      // real comments
  const [d1Items,     setD1Items]     = useState([]);      // auto D-1 comments
  const [text,        setText]        = useState("");
  const [pw,          setPw]          = useState("");
  const [submitErr,   setSubmitErr]   = useState("");
  const [showResults, setShowResults] = useState(false);
  const [d1,          setD1]          = useState(false);
  const [countdown,   setCountdown]   = useState("");
  const [daysLeft,    setDaysLeft]    = useState(7);
  const [isDDay,      setIsDDay]      = useState(false);

  const nickname = useRef((() => {
    let n = localStorage.getItem("butter_nick");
    if (!n) { n = genNick(); localStorage.setItem("butter_nick", n); }
    return n;
  })()).current;

  /* countdown to NEXT Saturday 17:00 */
  useEffect(() => {
    function getTarget() {
      return new Date("2026-04-11T23:00:00");
    }
    function calc() {
      const diff = getTarget() - Date.now();
      if (diff <= 0) {
        setCountdown("탄생 완료");
        setIsDDay(true);
        return;
      }
      const totalMin = Math.floor(diff / 60000);
      const days  = Math.floor(totalMin / 1440);
      const hours = Math.floor((totalMin % 1440) / 60);
      const mins  = totalMin % 60;
      const hh = String(hours).padStart(2, "0");
      const mm = String(mins).padStart(2, "0");
      setDaysLeft(days);
      setCountdown(days > 0 ? `D-${days}  ${hh}:${mm}` : `D-0  ${hh}:${mm}`);
    }
    calc();
    const id = setInterval(calc, 60000);
    return () => clearInterval(id);
  }, []);

  /* load localStorage */
  useEffect(() => {
    const sv = localStorage.getItem("butter_voted");
    const st = localStorage.getItem("butter_type");
    const sp = localStorage.getItem("butter_pct");
    const sc = localStorage.getItem("butter_comments");
    if (sv === "1") {
      setVoted(true); setVoteType(st); setAgreeP(parseInt(sp) || 62); setShowResults(true);
    }
    if (sc) setComments(JSON.parse(sc));
    const vc = parseInt(localStorage.getItem("butter_votecount") || "0");
    setVoteCount(vc);
    setD1(checkD1());
  }, []);

  /* auto-comment ticker (항상 활성, 전역 플래그로 이중 실행 완전 차단) */
  useEffect(() => {
    if (_tickerStarted) return;
    _tickerStarted = true;
    let tid;
    function drop() {
      const side = Math.random() < 0.5 ? "인정" : "억지";
      const pool = D1_POOL[side];
      const entry = pool[Math.floor(Math.random() * pool.length)];
      const item = {
        id:       `d1_${Date.now()}_${Math.random()}`,
        nickname: entry.nick,
        text:     entry.text,
        vote:     side,
        time:     fmtTime(),
        isD1:     true,
        tag:      side === "인정" ? "[유행]" : "[억지]",
      };
      setD1Items(prev => [...prev, item]);
      tid = setTimeout(drop, 1800 + Math.random() * 2800);
    }
    tid = setTimeout(drop, 800);
    return () => clearTimeout(tid);
  }, []);

  /* split by vote side (real + D-1 merged, chronological) */
  const allItems  = [...comments, ...d1Items].sort((a,b) => a.id < b.id ? -1 : 1);
  const agreeItems    = allItems.filter(c => c.vote === "인정");
  const disagreeItems = allItems.filter(c => c.vote === "억지");

  /* vote */
  function handleVote(type) {
    if (voted) return;
    const pct = type === "인정"
      ? 55 + Math.floor(Math.random() * 22)
      : 28 + Math.floor(Math.random() * 24);
    setVoted(true); setVoteType(type); setAgreeP(pct);
    setTimeout(() => setShowResults(true), 50);
    localStorage.setItem("butter_voted", "1");
    localStorage.setItem("butter_type",  type);
    localStorage.setItem("butter_pct",   String(pct));
    const next = voteCount + 1;
    setVoteCount(next);
    localStorage.setItem("butter_votecount", String(next));
  }

  /* submit comment */
  function submitComment() {
    setSubmitErr("");
    if (!text.trim()) return;
    if (hasBad(text)) { alert("부적절한 표현은 사용할 수 없습니다"); return; }
    const last = comments[comments.length - 1];
    if (last && last.nickname === nickname && last.text === text.trim()) {
      setSubmitErr("도배 의심 댓글은 등록할 수 없습니다"); return;
    }
    const c = {
      id:       Date.now().toString(),
      nickname,
      text:     text.trim(),
      password: pw.trim() || "0000",
      vote:     voteType || "인정",
      time:     fmtTime(),
    };
    const next = [...comments, c];
    setComments(next);
    localStorage.setItem("butter_comments", JSON.stringify(next));
    setText(""); setPw("");
  }
  function editComment(id, newText) {
    const next = comments.map(c => c.id === id ? { ...c, text: newText } : c);
    setComments(next); localStorage.setItem("butter_comments", JSON.stringify(next));
  }
  function deleteComment(id) {
    const next = comments.filter(c => c.id !== id);
    setComments(next); localStorage.setItem("butter_comments", JSON.stringify(next));
  }

  function getMessage() {
    if (agreeP >= 65) return "지금 분위기: 밀리는 중 🔥 이거 진짜 될지도 모르는데…";
    if (agreeP >= 50) return "이거 진짜 될 수도 있는데?? ⚡";
    return "의외로 안 된다는 쪽 많음 👀";
  }
  const disagreeP = 100 - agreeP;

  return (
    <div style={{ minHeight:"100vh", background:"linear-gradient(180deg, #09091e 0%, #0c0c22 40%, #0f0f2a 100%)" }}>

      <StarWarsCrawl />

      <div style={{ maxWidth:"720px", margin:"0 auto", padding:"2.2rem 1rem 4rem" }}>

        {/* Header */}
        <div className="fade-in-up" style={{ textAlign:"center", marginBottom:"2rem" }}>
          <div style={{ color:"#5ab4d4", fontSize:".72rem", letterSpacing:".3em", fontWeight:700, marginBottom:".5rem" }}>
            🍡 EPISODE VIII · 유행왕 승계 실험
          </div>
          <h1 style={{ fontSize:"clamp(1.8rem,6vw,2.6rem)", fontWeight:900, lineHeight:1.2, marginBottom:".6rem" }}>
            버터떡 유행왕 승계까지, <span style={{ color:"#ffd700" }}>D-{daysLeft}</span>
          </h1>
          <p style={{ color:"#9ca3af", fontSize:".9rem", marginBottom:"1.2rem" }}>
            버터떡, 우리가 충성하면 유행왕이 된다.&nbsp;
            <span style={{ color:"#4ade80", fontWeight:700 }}>vs.</span>
            &nbsp;<span style={{ color:"#f87171", fontWeight:700 }}>될 수 없다.</span>
          </p>
          {/* countdown */}
          <div style={{ display:"inline-block", background:"#0d0d1f", border:"1px solid #2a2a5a", borderRadius:"14px", padding:"10px 24px" }}>
            <div style={{ color:"#6b7280", fontSize:".65rem", letterSpacing:".15em", marginBottom:"4px" }}>4월 11일(토) 밤 11시 결과 발표까지</div>
            <div style={{ color:"#ffd700", fontSize:"clamp(1.6rem,6vw,2.2rem)", fontWeight:900, letterSpacing:".08em", fontVariantNumeric:"tabular-nums" }}>
              {countdown}
            </div>
          </div>
        </div>

        {/* ── D-Day 결과 공개 ── */}
        {isDDay && (
          <DDaySequence agreeP={agreeP} />
        )}

        {/* D-1 Banner */}
        {d1 && !isDDay && (
          <div className="d1-badge scale-in" style={{
            textAlign:"center", marginBottom:"1.5rem",
            background:"linear-gradient(135deg,#7c2d12,#9a3412)",
            borderRadius:"14px", padding:"12px",
            border:"1px solid #c2410c",
          }}>
            <span style={{ fontWeight:900, fontSize:"1rem", color:"#fed7aa" }}>
              🚨 D-1 — 오늘 자정이면 버터떡의 운명이 결정된다
            </span>
          </div>
        )}

        {/* 1,000명 Badge */}
        {voteCount >= 1000 && (
          <div className="scale-in" style={{ textAlign:"center", marginBottom:"1.5rem" }}>
            <div style={{
              display:"inline-flex", alignItems:"center", gap:"10px",
              background:"linear-gradient(135deg,#7c3aed,#4f46e5)",
              borderRadius:"999px", padding:"9px 22px",
              boxShadow:"0 0 30px rgba(124,58,237,.5)",
            }}>
              <span>🏆</span>
              <span style={{ fontWeight:800, fontSize:".9rem" }}>{voteCount.toLocaleString()}명 돌파!</span>
              <span>🏆</span>
            </div>
          </div>
        )}

        {/* ── Vote Buttons (side by side) ── */}
        {!voted ? (
          <div className="fade-in-up" style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"12px", marginBottom:"2.5rem" }}>
            <button className="vote-btn" onClick={() => handleVote("인정")} style={{
              padding:"1.4rem .5rem", borderRadius:"18px", border:"none",
              fontSize:"clamp(1rem,3.5vw,1.4rem)", fontWeight:900, color:"#fff", cursor:"pointer",
              background:"linear-gradient(135deg,#22c55e,#15803d)",
              boxShadow:"0 8px 32px rgba(34,197,94,.35)",
            }}>믿어본다 👍</button>
            <button className="vote-btn" onClick={() => handleVote("억지")} style={{
              padding:"1.4rem .5rem", borderRadius:"18px", border:"none",
              fontSize:"clamp(1rem,3.5vw,1.4rem)", fontWeight:900, color:"#fff", cursor:"pointer",
              background:"linear-gradient(135deg,#ef4444,#b91c1c)",
              boxShadow:"0 8px 32px rgba(239,68,68,.35)",
            }}>절대 안 된다 👎</button>
          </div>
        ) : (
          showResults && (
            <>
              {/* 입장 선언 카드 */}
              <div className="scale-in" style={{
                background: voteType === "인정"
                  ? "linear-gradient(135deg,#052e16,#064e3b)"
                  : "linear-gradient(135deg,#3b0a0a,#450a0a)",
                borderRadius:"20px", padding:"1.6rem 1.4rem", marginBottom:"1.2rem",
                border: voteType === "인정" ? "1px solid #166534" : "1px solid #7f1d1d",
                textAlign:"center",
              }}>
                <div style={{ color:"#9ca3af", fontSize:".78rem", marginBottom:".6rem" }}>나는</div>
                <div style={{
                  display:"inline-block",
                  background: voteType === "인정" ? "#14532d" : "#450a0a",
                  color:      voteType === "인정" ? "#86efac" : "#fca5a5",
                  fontWeight:900, fontSize:"1.1rem",
                  padding:"8px 20px", borderRadius:"10px", marginBottom:"1rem",
                }}>
                  {voteType === "인정" ? "👍 밀어본다" : "👎 절대 안 된다"}
                </div>
                <div style={{
                  color:"#e5e7eb", fontSize:".95rem", fontWeight:700, lineHeight:1.5,
                }}>
                  {voteType === "인정"
                    ? "버터떡 유행 가능하다 봄 ㅋㅋ"
                    : "유행은 사람 마음이지;"}
                </div>
              </div>

              {/* 결과 퍼센트 */}
              <div className="scale-in" style={{ background:"#111827", borderRadius:"20px", padding:"1.4rem", marginBottom:"2.5rem", border:"1px solid #1f2937" }}>
                <div style={{ textAlign:"center", marginBottom:"1.2rem" }}>
                  <div style={{ color:"#fff", fontWeight:800, fontSize:"1.05rem" }}>{getMessage()}</div>
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"12px" }}>
                  {[
                    { label:"👍 밀어본다", pct:agreeP,    color:"#22c55e", grad:"linear-gradient(90deg,#22c55e,#86efac)" },
                    { label:"👎 안 된다",  pct:disagreeP, color:"#ef4444", grad:"linear-gradient(90deg,#ef4444,#fca5a5)" },
                  ].map(({ label, pct, color, grad }) => (
                    <div key={label}>
                      <div style={{ display:"flex", justifyContent:"space-between", fontSize:".78rem", marginBottom:"5px" }}>
                        <span style={{ color, fontWeight:700 }}>{label}</span>
                        <span style={{ color, fontWeight:700 }}>{pct}%</span>
                      </div>
                      <div style={{ height:"10px", background:"#1f2937", borderRadius:"999px", overflow:"hidden" }}>
                        <div className="progress-bar" style={{ height:"100%", width:`${pct}%`, background:grad, borderRadius:"999px" }}/>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </>
          )
        )}

        {/* ── MAU 패널 ── (숨김) */}
        {/* <MauPanel /> */}

        {/* ── Live Comment Tickers ── */}
        <div style={{ marginBottom:"2rem" }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:"10px" }}>
            <h2 style={{ fontWeight:800, fontSize:"1rem" }}>💬 실시간 의견</h2>
            {d1 && <span style={{ fontSize:".7rem", color:"#fb923c", fontWeight:700 }}>● LIVE D-1 마지막 기회</span>}
          </div>
          {d1 ? (
            /* D-1: 하나의 통합 컬럼 */
            <TickerColumn side="all" items={allItems} onEdit={editComment} onDelete={deleteComment} userNick={nickname} />
          ) : (
            /* 평소: 인정 / 억지 좌우 분리 */
            <div style={{ display:"flex", gap:"10px" }}>
              <TickerColumn side="인정" items={agreeItems}    onEdit={editComment} onDelete={deleteComment} userNick={nickname} />
              <TickerColumn side="억지" items={disagreeItems} onEdit={editComment} onDelete={deleteComment} userNick={nickname} />
            </div>
          )}
        </div>

        {/* ── Comment Input ── */}
        {!voted ? (
          <div style={{ background:"#111827", borderRadius:"18px", padding:"1.2rem", marginBottom:"2rem", border:"1px solid #1f2937", textAlign:"center" }}>
            <div style={{ color:"#6b7280", fontSize:".85rem", marginBottom:".5rem" }}>💬 댓글은 투표 후 달 수 있어요</div>
            <div style={{ color:"#4b5563", fontSize:".75rem" }}>위에서 먼저 입장을 선택해주세요</div>
          </div>
        ) : (
          <div style={{ background:"#111827", borderRadius:"18px", padding:"1rem", marginBottom:"2rem", border:"1px solid #1f2937" }}>
            {/* 내 투표 뱃지 */}
            <div style={{ display:"flex", alignItems:"center", gap:"8px", marginBottom:"10px" }}>
              <span style={{ color:"#ffd700", fontSize:".78rem", fontWeight:700 }}>{nickname}</span>
              <span style={{
                fontSize:".7rem", padding:"2px 8px", borderRadius:"6px", fontWeight:800,
                background: voteType === "인정" ? "#14532d" : "#450a0a",
                color:      voteType === "인정" ? "#86efac" : "#fca5a5",
              }}>
                {voteType === "인정" ? "[밀어본다]" : "[안 된다]"}
              </span>
            </div>
            <textarea
              value={text}
              onChange={e => setText(e.target.value)}
              placeholder="왜 그렇게 생각함?"
              rows={3}
              style={{ width:"100%", background:"#0f0f1f", color:"#fff", borderRadius:"12px", padding:"10px 12px", fontSize:".88rem", border:"1px solid #2a2a5a", resize:"none", outline:"none", marginBottom:"10px", lineHeight:1.6, fontFamily:"inherit" }}
              onFocus={e => e.target.style.borderColor="#ffd700"}
              onBlur={e  => e.target.style.borderColor="#2a2a5a"}
            />
            <div style={{ display:"flex", gap:"8px" }}>
              <input
                type="password" placeholder="비밀번호 (수정·삭제용)"
                value={pw} onChange={e => setPw(e.target.value)}
                onKeyDown={e => e.key === "Enter" && submitComment()}
                style={{ flex:1, background:"#0f0f1f", color:"#fff", borderRadius:"12px", padding:"9px 12px", fontSize:".82rem", border:"1px solid #2a2a5a", outline:"none", fontFamily:"inherit" }}
                onFocus={e => e.target.style.borderColor="#ffd700"}
                onBlur={e  => e.target.style.borderColor="#2a2a5a"}
              />
              <button onClick={submitComment} style={{ background:"linear-gradient(135deg,#ffd700,#f59e0b)", color:"#000", border:"none", borderRadius:"12px", padding:"9px 18px", fontWeight:800, fontSize:".85rem", cursor:"pointer", whiteSpace:"nowrap" }}>
                등록
              </button>
            </div>
            {submitErr && <p style={{ color:"#f87171", fontSize:".75rem", marginTop:"6px" }}>{submitErr}</p>}
          </div>
